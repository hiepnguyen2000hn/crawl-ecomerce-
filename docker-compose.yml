services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: crawl_ecomerce
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Container chạy một lần rồi thoát. Tách riêng thay vì nhét `alembic upgrade head`
  # vào command của api: nếu cả api lẫn worker cùng migrate thì hai tiến trình đua
  # nhau trên cùng một schema. Ở đây migrate chạy xong mới tới lượt hai cái kia.
  migrate:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/crawl_ecomerce
    volumes:
      # Bind mount để file migration do `alembic revision` sinh ra nằm trên host,
      # không biến mất cùng container `--rm`.
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    command: alembic upgrade head
    restart: "no"

  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/crawl_ecomerce
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - .:/app          # cần cho --reload: không mount thì sửa code không ăn
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/crawl_ecomerce
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - .:/app
    command: arq app.worker.WorkerSettings

  cloakbrowser:
    image: cloakhq/cloakbrowser:latest
    command: cloakserve
    restart: unless-stopped
    ports:
      - "127.0.0.1:9222:9222"
    environment:
      CLOAKBROWSER_LICENSE_KEY: ${CLOAK_LICENSE_KEY:-}
    volumes:
      # Persistent Chrome profiles — cookies/localStorage survive restart
      - cloak_profiles:/profiles
    shm_size: "2gb"        # Chrome cần shared memory, tăng nếu nhiều tab
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9222/json/version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  adminer:
    image: adminer:latest
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  cloak_profiles:
