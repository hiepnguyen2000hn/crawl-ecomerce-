[alembic]
script_location = alembic

# Tên file migration có timestamp ở đầu — nhìn thư mục là biết thứ tự, giống
# cách TypeORM đặt tên bên levelup_be (1783800300000-AddProductResourceSource.ts).
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

prepend_sys_path = .
timezone = UTC

# sqlalchemy.url CỐ Ý để trống: URL thật lấy từ app/config.py (biến DATABASE_URL)
# trong alembic/env.py, để không phải khai báo chuỗi kết nối ở hai nơi — và để
# container dùng đúng host `db` mà không cần sửa file này.
sqlalchemy.url =


[post_write_hooks]
# Bỏ trống. Nếu sau này thêm black/ruff vào requirements thì bật ở đây để
# migration sinh ra được format tự động.


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
